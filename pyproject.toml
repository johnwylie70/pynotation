[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "staves"
version = "0.0.0"
description = "Music written as notes on a staff, for a Pyctures scene: a tune, a tracker song or plain data is drawn as sheet music that lights up as it plays, and a learner can play along."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "LICENSE-GLYPHS"]
authors = [{ name = "John Wylie" }]
keywords = ["music", "notation", "sheet music", "staff", "score", "tracker", "piano", "games", "education", "pyodide"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Education",
]
dependencies = ["pyctures>=0.2.0"]

[project.optional-dependencies]
test = ["pytest>=7", "playwright>=1.40"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
staves = ["web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
